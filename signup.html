<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Sign Up</title>
    <style>

body{
    margin:0;
    font-family: Arial, sans-serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

/* 🔥 Background Image */
body::before{
    content:"";
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:url("si.PNG") no-repeat center center/cover;
    filter: blur(8px);
    z-index:-2;
}

/* 🔥 Dark overlay */
body::after{
    content:"";
    position:fixed;
    width:100%;
    height:100%;
    background: rgba(0,0,0,0.3);
    z-index:-1;
}

/* ✨ Glass Container */
.container{
    width: 400px;
    padding: 30px;
    border-radius: 15px;

    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    border: 1px solid rgba(255,255,255,0.3);
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
}

/* Heading */
h2{
    text-align: center;
    color: white;
}

/* ✅ FORM ALIGNMENT FIX */
form{
    display: flex;
    flex-direction: column;
    gap: 15px; /* equal spacing */
}

/* Inputs */
input{
    width: 100%;
    padding: 12px 14px;
    border-radius: 8px;
    border: none;
    outline: none;
    font-size: 14px;

    box-sizing: border-box; /* important */
}

/* Button */
button{
    width: 100%;
    padding: 12px;
    background: #0a7f8f;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

button:hover{
    background: #06606b;
}

/* Message */
#msg{
    text-align:center;
    margin-top:10px;
    font-weight:bold;
    color:white;
}

</style>
</head>
<body>

<div class="container">
    <h2>Patient Sign Up</h2>

    <form id="signupForm">
        <input type="text" name="name" placeholder="Enter Full Name" required>
        <input type="email" name="email" placeholder="Enter Email" required>
        <input type="password" name="password" placeholder="Enter Password" required>
        <button type="submit">Sign Up</button>
    </form>

    <p id="msg"></p>
</div>

<script>
document.getElementById("signupForm").addEventListener("submit", function(e){
    e.preventDefault();

    let formData = new FormData(this);

    fetch("http://localhost/HOSPITAL_MANAGEMENT/signup.php", {
        method: "POST",
        body: formData
    })
    .then(res => res.text())
    .then(res => {
        const msg = document.getElementById("msg");
        msg.innerText = res;

        if(res.includes("SUCCESS")){
            msg.style.color = "green";
            setTimeout(() => {
                window.location.href = "services.html";
            }, 1000);
        } else {
            msg.style.color = "red";
        }
    })
    .catch(err => {
        console.log(err);
        document.getElementById("msg").innerText = "Signup failed";
        document.getElementById("msg").style.color = "red";
    });
});
</script>

</body>
</html>
